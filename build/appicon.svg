<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Logo de SSM Portway: un arco/portal (el "tunel" de SSM port-forwarding)
    con dos chevrones que sugieren el trafico avanzando a traves de el.
    Fuente vectorial; los PNG/ICO se generan a partir de este archivo
    (ver build/README.md).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cf7"/>
      <stop offset="1" stop-color="#0f1a2b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- arco del portal, exterior -->
  <path d="M 166 366
           L 166 256
           A 90 90 0 0 1 346 256
           L 346 366
           Z"
        fill="#f4f7fb"/>

  <!-- arco del portal, interior (deja ver el fondo -> efecto de "hueco") -->
  <path d="M 202 366
           L 202 256
           A 54 54 0 0 1 310 256
           L 310 366
           Z"
        fill="url(#bg)"/>

  <!-- chevrones: el trafico avanzando a traves del tunel -->
  <path d="M 234 292 L 256 314 L 234 336" fill="none" stroke="#f4f7fb" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 270 292 L 292 314 L 270 336" fill="none" stroke="#f4f7fb" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
