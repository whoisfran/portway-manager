<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Isotipo para la bandeja del sistema: el mismo arco/portal de
    appicon.svg, pero re-dibujado en un canvas de 32x32 con una banda
    mas gruesa y sin fondo ni degradado. A esta escala, el mismo
